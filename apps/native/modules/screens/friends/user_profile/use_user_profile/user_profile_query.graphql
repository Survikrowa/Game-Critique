query UserProfile($oauthId: String!) {
    user(oauthId: $oauthId) {
        id,
        oauthId,
        profile {
            id
            name,
            avatarUrl
        }
        gamesStatus {
            achievementsCompleted
        }
        userActivity {
            id
            activityType
            game {
                id
                name
                cover {
                    id
                    bigUrl
                }
            }
            updatedAt
            formattedUpdatedAt
        }
    }

}