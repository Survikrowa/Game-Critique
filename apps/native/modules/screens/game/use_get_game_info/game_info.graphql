query GameInfo($gameId: Int!) {
  game(gameId: $gameId) {
    id
    name
    cover {
      mediumUrl
    }
    platforms {
      name
      id
    }
    genres {
      name
    }
    releases {
      date
    }
    completionTime {
      main
      mainExtra
      completionist
    }
    gameMetadata {
      physicalMedia {
        platform
        hasPhysicalRelease
        hasGameOnDisc
      }
    }
    gameRating {
      aggregatedRating
      aggregatedCount
      igdbRating
      igdbRatingCount
      igdbUrl
    }
  }
}
